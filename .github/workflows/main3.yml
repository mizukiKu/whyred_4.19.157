- name: Building kernel
      run: |
        # stop on error and ensure pipeline failures propagate, but ensure cleanup runs
        set -eo pipefail

        export CLANGDIR="${{ steps.tools.outputs.tools-folder }}/clang"
        export KERNEL_DIR="${{ steps.kernel.outputs.kernel-folder }}"
        export OUT_DIR="${KERNEL_DIR}/out"
        mkdir -p "${OUT_DIR}"
        rm -f "${OUT_DIR}/compile.log"

        # selalu salin compile.log ke workspace meskipun build gagal
        trap 'cp -f "${OUT_DIR}/compile.log" $GITHUB_WORKSPACE/ || true' EXIT

        # environment
        export KBUILD_BUILD_USER="builder"
        export KBUILD_BUILD_HOST="dhamarar"
        export USE_CCACHE=1
        export PATH="$CLANGDIR/bin:$PATH"
        export KCFLAGS="$KCFLAGS -Wno-default-const-init-field-unsafe"

        # safer defaults for GitHub Actions (runners punya RAM terbatas)
        # JOBS input dapat ditambahkan di bagian `on.workflow_dispatch.inputs`:
        # JOBS: description: 'make -j jobs' default: '2' required: false
        JOBS="${{ github.event.inputs.JOBS || '2' }}"
        # limit jobs to a reasonable integer (fallback to 2 jika input aneh)
        if ! [[ "$JOBS" =~ ^[0-9]+$ ]]; then
          JOBS=2
        fi

        # relax stack size (kadang membantu)
        ulimit -s unlimited || true

        # configure ccache size (jika tersedia)
        if command -v ccache >/dev/null 2>&1; then
          ccache -M 50G || true
        fi

        cd "${KERNEL_DIR}"

        # Determine proper defconfig target:
        INPUT_DEF="${{ github.event.inputs.DEFCONFIG }}"
        NORMALIZED_DEF="$(echo "${INPUT_DEF}" | sed -E 's/_?defconfig$//')"
        if [ -z "$NORMALIZED_DEF" ]; then
          DEF_TARGET="defconfig_defconfig"
        else
          DEF_TARGET="${NORMALIZED_DEF}_defconfig"
        fi

        echo "Using defconfig target: ${DEF_TARGET}"
        echo "Make jobs: ${JOBS}"
        echo "Kernel out dir: ${OUT_DIR}"

        # run defconfig target (tee to compile.log)
        if ! make O=out ARCH=arm64 "${DEF_TARGET}" 2>&1 | tee -a "${OUT_DIR}/compile.log"; then
          echo "ERROR: generating defconfig failed — lihat compile.log (uploaded as artifact)." >&2
          exit 2
        fi

        # run build with controlled parallelism; capture exit code but keep trap to copy log
        if ! make -j"${JOBS}" O=out LLVM=1 LLVM_IAS=1 \
           ARCH=arm64 \
           CC=clang \
           LD=ld.lld \
           AR=llvm-ar \
           AS=llvm-as \
           NM=llvm-nm \
           STRIP=llvm-strip \
           OBJCOPY=llvm-objcopy \
           OBJDUMP=llvm-objdump \
           READELF=llvm-readelf \
           HOSTCC=clang \
           HOSTCXX=clang++ \
           HOSTAR=llvm-ar \
           HOSTLD=ld.lld \
           CROSS_COMPILE=aarch64-linux-gnu- \
           CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
           2>&1 | tee -a "${OUT_DIR}/compile.log"; then

          BUILD_EXIT=$?
          echo "BUILD FAILED with exit code ${BUILD_EXIT}" >&2

          # show last lines for quick diagnosis
          echo "===== TAIL compile.log (last 200 lines) ====="
          tail -n 200 "${OUT_DIR}/compile.log" || true
          echo "============================================="

          # simple heuristics: cari indikasi OOM / KILLED
          if grep -i -E "killed|out of memory|oom" "${OUT_DIR}/compile.log" >/dev/null 2>&1; then
            echo ""
            echo "=== Detected possible out-of-memory (OOM) or killed process ==="
            echo "Saran: kurangi jumlah JOBS (input 'JOBS') menjadi 1 atau 2, atau gunakan runner dengan lebih banyak memori."
            echo "Contoh: set DEFCONFIG dan JOBS saat menjalankan workflow: JOBS=1"
            echo ""
          fi

          # exit with original code so GitHub shows failure
          exit "${BUILD_EXIT}"
        fi

        # elapsed time for build (only reached if build succeeded)
        echo "elapsed_time=$(echo \"$(date +%s)\"-\"${{ steps.workspace.outputs.start_time }}\" | bc)" >> $GITHUB_OUTPUT
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}
      id: build
