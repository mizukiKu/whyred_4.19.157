name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: RezzzzFy
      with:
        arch: arm64
        compiler: gcc/12
        defconfig: defconfig
        image: Image.gz-dtb
